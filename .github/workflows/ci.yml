name: CI

# Gate every push and pull request on the same checks developers run locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, format, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Advisory only: the repo predates Prettier enforcement and has not yet had
      # a one-time `prettier --write .` pass, so this reports drift without
      # failing the build. Make it a hard gate once the repo is fully formatted.
      - name: Format check (advisory)
        run: npm run format:check
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Build-only placeholders so server modules that read env at build
          # time don't fail. Real secrets are configured in the deploy platform.
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          GROQ_API_KEY: ci-placeholder-key
